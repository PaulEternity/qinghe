services:
  - type: web
    name: qinghe
    runtime: node
    plan: free
    region: singapore
    branch: master
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.1
      - key: APP_MODE
        value: cloud
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        value: qinghe
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: AI_INITIAL_CODE
        sync: false
      - key: MODEL_CONFIG_SECRET
        sync: false
      - key: MODEL_BASE_URL
        value: https://api.deepseek.com
      - key: MODEL_NAME
        value: deepseek-flash
      - key: MODEL_API_KEY
        sync: false
